apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
  namespace: canary-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
      version: v2
  template:
    metadata:
      labels:
        app: myapp
        version: v2
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:0.2.3
          args: ["-text=v2", "-listen=:8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-v2
  namespace: canary-demo
spec:
  selector:
    app: myapp
    version: v2
  ports:
    - port: 8080
      targetPort: 8080
