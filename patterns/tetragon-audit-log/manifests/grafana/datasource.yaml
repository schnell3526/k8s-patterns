apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: tetragon-audit-demo
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.tetragon-audit-demo.svc.cluster.local:3100
        isDefault: true
        editable: true
