apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mlflow-postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.12
          # カスタム postgresql.conf を指定
          args: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # PVC 直下ではなく subPath を使う理由:
            # PostgreSQL は PGDATA ディレクトリの所有権を要求する。
            # PVC のルートには lost+found 等が存在しうるため、subPath で隔離する。
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
              readOnly: true
            - name: postgres-config
              mountPath: /docker-entrypoint-initdb.d/init-mlflow-db.sql
              subPath: init-mlflow-db.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: postgres-config
          configMap:
            name: postgres-config
  # StatefulSet の volumeClaimTemplates により、Pod ごとに PVC が自動作成される
  # Pod が再スケジュールされても同じ PVC に再マウントされるため、データが永続化される
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
