apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: mlflow-oidc
  labels:
    app: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.2
          args:
            - --provider=oidc
            - --skip-oidc-discovery=true
            - --oidc-issuer-url=http://keycloak.mlflow-oidc.svc.cluster.local:8080/keycloak/realms/mlflow
            - --insecure-oidc-skip-issuer-verification=true
            - --oidc-jwks-url=http://keycloak.mlflow-oidc.svc.cluster.local:8080/keycloak/realms/mlflow/protocol/openid-connect/certs
            - --login-url=http://localhost/keycloak/realms/mlflow/protocol/openid-connect/auth
            - --redeem-url=http://keycloak.mlflow-oidc.svc.cluster.local:8080/keycloak/realms/mlflow/protocol/openid-connect/token
            - --profile-url=http://keycloak.mlflow-oidc.svc.cluster.local:8080/keycloak/realms/mlflow/protocol/openid-connect/userinfo
            - --skip-claims-from-profile-url
            - --upstream=http://mlflow.mlflow-oidc.svc.cluster.local:5000
            - --http-address=0.0.0.0:4180
            - --redirect-url=http://localhost/oauth2/callback
            - --cookie-secure=false
            - --skip-provider-button=true
            - --email-domain=*
            - --scope=openid profile email
          ports:
            - containerPort: 4180
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: cookie-secret
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 250m
