name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@v5.3.0
      with:
        # yamllint の実行に必要なツールだけを入れる
        install_args: python uv yamllint
    - run: yamllint --strict .
